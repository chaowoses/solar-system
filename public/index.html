<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Orbit Lab</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23101419'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%23e8a33d'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23d9d3c3' stroke-width='1'/%3E%3Ccircle cx='25' cy='16' r='2' fill='%23d9d3c3'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
    { "imports": { "three": "./js/vendor/three/three.module.min.js", "three/addons/": "./js/vendor/three/" } }
  </script>
</head>
<body>
  <main class="sim">
    <canvas id="view" aria-label="Top-down view of a star and one planet"></canvas>
    <canvas id="view3d" aria-label="3D view of a star and one planet"></canvas>
    <canvas id="hud3d" aria-hidden="true"></canvas>

    <div class="hudbox" id="hudbox">
      <div class="panel timer" role="timer" aria-label="Timer">
        <div class="timer-head" id="timerGrip" title="Drag to move (double-click to reset)">
          <span class="label">Timer</span>
          <button type="button" id="timerReset" class="grip-btn" hidden aria-label="Reset timer position and size" title="Reset position and size"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11V4h7"/><path d="M13 13L5 5"/></svg></button>
        </div>
        <div class="timer-row"><output id="timer">0.000</output><span class="unit">s</span></div>
        <div class="speed">
          <label for="speed">Simulation Speed</label>
          <output id="speedOut">1.0&times;</output>
        </div>
        <input id="speed" type="range" min="0.5" max="5" value="1" step="0.1" aria-label="Simulation speed">
        <span class="resize-grip" id="timerResize" title="Drag to resize" aria-hidden="true"><svg viewBox="0 0 12 12" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><path d="M11 4L4 11M11 8L8 11"/></svg></span>
      </div>


    </div>

    <div class="panel masses" aria-label="Masses">
      <span class="mass">Star <var>M</var> <b id="starMass">500</b></span>
      <span class="mass">Planet <var>m</var> <b id="planetMass">0.001</b></span>
      <span>Set <b id="letter">&mdash;</b></span>
    </div>

    <div class="toolbar" role="toolbar" aria-label="Simulation controls">
      <button type="button" id="play" class="btn primary" aria-keyshortcuts="Space">Play</button>
      <button type="button" id="reset" class="btn" title="Put the planet back where you placed it and zero the timer">Reset</button>
      <span class="sep" aria-hidden="true"></span>
      <button type="button" id="tape" class="btn" aria-pressed="false">Tape measure</button>
      <span class="sep" aria-hidden="true"></span>
      <button type="button" id="toggle3d" class="btn" aria-pressed="false" title="Switch between the flat lab view and a 3D view (place and aim the planet in 2D)">3D view</button>
    </div>

    <div class="zoom" role="group" aria-label="Zoom">
      <button type="button" id="zin" class="btn icon" aria-label="Zoom in" title="Zoom in"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
      <button type="button" id="zout" class="btn icon" aria-label="Zoom out" title="Zoom out"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"/></svg></button>
      <button type="button" id="fit" class="btn icon" aria-label="Reset view" title="Reset view"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="6.5"/><path d="M12 2v4.5M12 17.5V22M2 12h4.5M17.5 12H22"/><circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"/></svg></button>
    </div>

    <div class="scale only2d" aria-hidden="true"><span class="scale-bar" id="scaleBar"></span><span id="scaleLabel"></span></div>
    <p class="hint3d" id="hint3d" hidden>Drag the planet or its arrow to set up &middot; drag empty space to orbit &middot; right-drag or shift-drag to pan &middot; scroll to zoom</p>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
