<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Orbit Lab</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23101419'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%23e8a33d'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23d9d3c3' stroke-width='1'/%3E%3Ccircle cx='25' cy='16' r='2' fill='%23d9d3c3'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="sim">
    <canvas id="view" aria-label="Top-down view of a star and one planet"></canvas>

    <div class="panel timer" role="timer" aria-label="Timer">
      <span class="label">Timer</span>
      <div class="timer-row"><output id="timer">0.000</output><span class="unit">s</span></div>
      <div class="speed">
        <label for="speed">Simulation Speed</label>
        <output id="speedOut">1.0&times;</output>
      </div>
      <input id="speed" type="range" min="0.5" max="5" value="1" step="0.1" aria-label="Simulation speed">
    </div>

    <div class="panel theory" id="theory" hidden aria-label="Theoretical values">
      <div id="theoryR" hidden><span class="label">Orbit radius</span><output id="theoryRVal">&mdash;</output></div>
      <div id="theoryT" hidden><span class="label">Orbit time</span><output id="theoryTVal">&mdash;</output></div>
    </div>

    <div class="panel masses" aria-label="Masses">
      <span>Star <var>M</var> <b id="starMass">500</b></span>
      <span>Planet <var>m</var> <b id="planetMass">0.001</b></span>
    </div>

    <div class="toolbar" role="toolbar" aria-label="Simulation controls">
      <button type="button" id="play" class="btn primary" aria-keyshortcuts="Space">Play</button>
      <button type="button" id="reset" class="btn" title="Put the planet back where you placed it and zero the timer">Reset</button>
      <span class="sep" aria-hidden="true"></span>
      <button type="button" id="tape" class="btn" aria-pressed="false">Tape measure</button>
      <span class="sep" aria-hidden="true"></span>
      <button type="button" id="openTeacher" class="btn">Instructor</button>
    </div>

    <div class="zoom" role="group" aria-label="Zoom">
      <button type="button" id="zin" class="btn icon" aria-label="Zoom in" title="Zoom in"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
      <button type="button" id="zout" class="btn icon" aria-label="Zoom out" title="Zoom out"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"/></svg></button>
      <button type="button" id="fit" class="btn icon" aria-label="Reset view" title="Reset view"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="6.5"/><path d="M12 2v4.5M12 17.5V22M2 12h4.5M17.5 12H22"/><circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"/></svg></button>
    </div>

    <div class="scale" aria-hidden="true"><span class="scale-bar" id="scaleBar"></span><span id="scaleLabel"></span></div>

    <section class="panel check" id="teacher" hidden aria-labelledby="teacherTitle">
      <div class="check-head">
        <h2 id="teacherTitle">Instructor</h2>
        <button type="button" id="closeTeacher" class="btn icon quiet" aria-label="Close" title="Close"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>

      <form id="pinForm" autocomplete="off">
        <p class="note">Enter the PIN to open the instructor panel.</p>
        <div class="field">
          <label class="field-label" for="pin">PIN</label>
          <div class="pin-wrap">
            <input id="pin" class="masked" name="instructor-code" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" data-lpignore="true" data-1p-ignore data-bwignore data-form-type="other">
            <button type="button" id="togglePin" class="pin-eye" aria-pressed="false" aria-label="Show PIN" title="Show PIN"><svg class="eye" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><svg class="eye-off" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7c2.1 0 3.9.8 5.4 1.8M22 12s-3.6 7-10 7c-2.1 0-3.9-.8-5.4-1.8"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/><path d="M3 3l18 18"/></svg></button>
          </div>
        </div>
        <p class="error" id="teacherError" role="alert" hidden></p>
        <button type="submit" id="unlock" class="btn primary">Open</button>
      </form>

      <div id="tools" hidden>
        <div class="g-row">
          <span class="g-label"><var>G</var> =</span>
          <output id="gValue" class="g-value">&bull;&bull;&bull;&bull;&bull;</output>
          <button type="button" id="toggleG" class="btn" aria-pressed="false">Show</button>
        </div>
        <label class="switch"><input type="checkbox" id="optRadius"><span>Show theoretical orbit radius</span></label>
        <label class="switch"><input type="checkbox" id="optPeriod"><span>Show theoretical orbit time</span></label>
        <button type="button" id="randomize" class="btn danger" title="Picks a new G for this computer and restarts the simulation">Randomize G</button>
      </div>
    </section>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
